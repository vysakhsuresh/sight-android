name: Android quality checks
# From ../stave-android/.github/workflows/android.yml (12 Nov 2026). The engine job needs no
# Android SDK: it is the proof that :engine imports nothing from android.* and that every suite,
# FallbackChecks first, passes. The build job is the laptop's gate, plus the manifest check.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    name: Pure engine (no Android SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.ikshana-kt
          key: ikshana-kt-2.2.21
      - name: Compile engine/ without android.* and run every suite
        run: bash tools/jvm/run.sh
      - name: Static checks over the app's Kotlin
        run: |
          python3 tools/check_nesting.py
          python3 tools/check_modifier_imports.py
          python3 tools/check_dependencies.py
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch the interim Read models (pinned, checked)
        run: bash tools/models/fetch_tessdata.sh
      - name: Engine tests, lint, debug APK and release APK
        run: ./gradlew :engine:test lintDebug assembleDebug assembleRelease --console plain
      - name: Failed unit tests, with their messages
        if: failure()
        run: find . -path '*/build/test-results/*' -name '*.xml' -exec grep -h -B1 -A6 '<failure' {} \; 2>/dev/null | head -160
      - name: Verify merged manifests (debug and release)
        run: python3 tools/verify_manifest.py
      # Stave, 11 November: every run went red on "Artifact storage quota has been hit" with every
      # check passing. An upload is a convenience, never the verdict.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ikshana-reports
          retention-days: 7
          path: app/build/reports/
      - uses: actions/upload-artifact@v4
        if: success()
        continue-on-error: true
        with:
          name: ikshana-apk
          retention-days: 2
          path: app/build/outputs/apk/debug/*.apk
